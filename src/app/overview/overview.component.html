<div class="card">
    <h1>Overview</h1>
    <div class="overview-actions">
        @if (!showAddForm()) {
            <button (click)="showAddForm.set(true)" class="btn btn-primary">Add Bookmark</button>
            @if (bookmarks().length === 0) {
                <button (click)="seedBookmarks()" class="btn btn-success">Seed Bookmarks</button>
            } @else {
                <button (click)="deleteBookmarks()" class="btn btn-danger">Delete All</button>
            }
        }
    </div>
    @if (showAddForm()) {
        <app-form 
            [existingBookmarks]="bookmarks()"
            (bookmarkAdded)="onBookmarkAdded($event)"
            (cancel)="showAddForm.set(false)">
        </app-form>
    } @else {
        <app-bookmarks [bookmarks]="bookmarks()"></app-bookmarks>
    }
</div>
